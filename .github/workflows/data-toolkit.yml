name: Data toolkit checks
on:
  pull_request:
    paths: ['data-toolkit/**', '.github/workflows/data-toolkit.yml']
  push:
    paths: ['data-toolkit/**', '.github/workflows/data-toolkit.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python data-toolkit/test_catalog.py
      - name: Verify locked dependency resolution without installation
        run: python -m pip install --dry-run --ignore-installed --require-hashes --only-binary=:all: -r data-toolkit/requirements/windows-py314.lock.txt
